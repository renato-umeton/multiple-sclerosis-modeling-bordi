# GitHub issue form for a bug report.
name: Bug report
description: Something in msrelapse does not do what its documentation says
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this.

        Please do not paste patient identifiable data into a public issue. The
        records this package ships are synthetic, and a minimal example built
        on `msrelapse.load_synthetic_bordi2013()` is usually enough to show a
        problem.
  - type: input
    id: version
    attributes:
      label: msrelapse version
      description: 'The output of: python -c "import msrelapse; print(msrelapse.__version__)"'
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: "The output of: python --version"
      placeholder: "3.12.7"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 on arm64, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran, in the order you ran it.
      placeholder: |
        1. Generate a cohort with ...
        2. Call ... on it
        3. Read the value of ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the full traceback or the wrong output, not a summary of it.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code that shows the problem
      description: >-
        The shortest script that reproduces it. Fix every seed, so that the run
        repeats itself. This is pasted into a Python block, so no backticks are
        needed.
      render: python
    validations:
      required: true
