name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project
        run: uv sync --locked --all-extras --all-groups
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Check formatting
        run: uv run ruff format --check --diff .
      - name: Type check
        run: uv run mypy

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Read in the `if` of the upload step: a step `if` cannot see `secrets`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --all-extras --group dev
      - name: Run tests
        run: uv run pytest --cov=msrelapse --cov-report=xml
        env:
          # Compiled kernels report as uncovered otherwise.
          NUMBA_DISABLE_JIT: "1"
      - name: Upload coverage
        if: >-
          matrix.os == 'ubuntu-latest'
          && matrix.python-version == '3.13'
          && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project and the documentation group
        run: uv sync --locked --group docs
      - name: Build the site
        # Strict mode turns a broken cross reference or a page missing from the
        # navigation into a failure, which is why the build runs on every PR.
        # The step above is the install, so this one skips the sync that `uv
        # run` would otherwise perform and uses the environment as installed.
        run: uv run --no-sync mkdocs build --strict

  notebooks:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project with every extra and group
        run: uv sync --locked --all-extras --all-groups
      - name: Execute the notebooks
        # The step above is the install; this one uses it as it stands.
        run: uv run --no-sync pytest -m notebook
