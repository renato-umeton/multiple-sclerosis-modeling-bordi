name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These are the jobs that run project code, the third party test dependencies
# and the notebooks, so they hold the least the platform can give them. Nothing
# here writes to the repository. Stated rather than inherited, because the
# repository default is a setting a reader of this file cannot see, and
# release.yml and docs.yml both state theirs.
permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project
        run: uv sync --locked --all-extras --all-groups
      - name: Lint
        # The step above is the install; this one uses it as it stands.
        run: uv run --no-sync ruff check --output-format=github .
      - name: Check formatting
        run: uv run --no-sync ruff format --check --diff .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Validate the citation metadata
        # CITATION.cff tells the maintainer to check a change with this command.
        # Running it here is what turns that note into a gate, and the file is
        # what Zenodo and the reference managers read.
        run: uvx cffconvert --validate -i CITATION.cff

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Read in the `if` of the upload step: a step `if` cannot see `secrets`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --locked --all-extras --group dev
      - name: Run tests
        # The step above is the install; this one uses it as it stands.
        run: uv run --no-sync pytest --cov=msrelapse --cov-report=xml
        env:
          # Compiled kernels report as uncovered otherwise.
          NUMBA_DISABLE_JIT: "1"
      - name: Upload coverage
        if: >-
          matrix.os == 'ubuntu-latest'
          && matrix.python-version == '3.13'
          && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project and the documentation group
        run: uv sync --locked --group docs
      - name: Build the site
        # Strict mode turns a broken cross reference or a page missing from the
        # navigation into a failure, which is why the build runs on every PR.
        # The step above is the install, so this one skips the sync that `uv
        # run` would otherwise perform and uses the environment as installed.
        run: uv run --no-sync mkdocs build --strict

  notebooks:
    needs: lint
    runs-on: ubuntu-latest
    # Each notebook is given 900 seconds by tests/test_notebooks.py, so a run
    # that passes this is stuck rather than slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project with every extra and group
        run: uv sync --locked --all-extras --all-groups
      - name: Execute the notebooks
        # The step above is the install; this one uses it as it stands.
        run: uv run --no-sync pytest -m notebook
      - name: Compare the compiled kernels with the numpy ones
        # Every other job that runs the suite sets NUMBA_DISABLE_JIT=1, which
        # makes numba.njit hand back the plain Python function, so the tests
        # that exist to prove the compiled kernel and the numpy kernel agree
        # compare a Python loop with numpy there and never reach compiled code.
        # This job sets no such variable, so they run here, where numba really
        # compiles. A selector that stops matching collects nothing, and pytest
        # fails the step rather than passing on an empty run.
        run: uv run --no-sync pytest -k "numba or kernel"

  build:
    # The distribution is built and checked on every push and pull request, and
    # not for the first time on a tag. A mistake in the build configuration, in
    # the sdist include list, in the classifiers or in the README rendering is
    # then a failure here, where it is cheap, rather than in the middle of a
    # release, where the tag has already been pushed.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - name: Install the project
        # The notebooks group as well as the dev one, because the packaged
        # suite run below holds tests/test_notebooks.py, which skips the whole
        # module when nbformat and nbclient are missing. Without the group the
        # notebook checks of the archive would be skipped rather than run, and
        # the step would report success without having looked at them.
        run: uv sync --locked --all-extras --group dev --group notebooks
      - name: Build the wheel and the sdist
        run: uv build
      - name: Check the metadata
        # The same check release.yml runs on a tag.
        run: uvx twine check --strict dist/*
      - name: Run the shipped suite from the sdist
        # The sdist carries tests/, so it has to carry everything those tests
        # read. Unpacking the archive and running the suite from it is what
        # keeps the include list in pyproject.toml honest, and it is what a
        # downstream packager does. The notebooks job covers the slow tests.
        run: |
          mkdir unpacked
          tar xzf dist/*.tar.gz -C unpacked
          uv run --no-sync python -m pytest unpacked/msrelapse-*/tests -m "not slow"
        env:
          NUMBA_DISABLE_JIT: "1"
      - name: Install the wheel on its own and run the command line
        # Nothing of the checkout is on the path of that environment, so this
        # fails if the wheel is missing a module or a packaged data file.
        # `cite` reads the distribution metadata, and `reproduce` reads the
        # packaged CSV files and runs the analysis end to end, so between them
        # the two commands reach everything the wheel has to carry.
        # `--no-figures` keeps matplotlib out of it: the plot extra is not
        # installed here, and drawing is not what this step is checking.
        run: |
          uv run --no-project --with dist/*.whl msrelapse cite
          uv run --no-project --with dist/*.whl msrelapse reproduce \
            --no-figures --out "$RUNNER_TEMP/reproduce"
